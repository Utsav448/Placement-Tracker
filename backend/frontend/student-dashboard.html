<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Drives — Placement Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="brand">
    <div class="seal">PT</div>
    <div>
      <h1>Placement Tracker</h1>
      <div class="tagline">Office of Campus Recruitment</div>
    </div>
  </div>
  <div>
    <nav style="display:inline">
      <a href="student-dashboard.html">Open Drives</a>
      <a href="my-applications.html">My Applications</a>
      <a href="companies.html">Companies</a>
      <a href="saved.html">Saved</a>
      <a href="profile.html">My Profile</a>
      <a onclick="logout()" style="cursor:pointer">Log Out</a>
    </nav>
  </div>
</header>

<div class="page">
  <h2 class="page-title">Open Drives</h2>
  <p class="page-subtitle">Browse current placement drives and apply directly.</p>

  <div class="welcome-strip">
    <div class="who">
      <div class="name" id="welcome-name">—</div>
      <div class="sub" id="welcome-sub">—</div>
    </div>
    <div class="figures">
      <div><strong id="fig-total">–</strong><span>Drives Open</span></div>
      <div><strong id="fig-eligible">–</strong><span>You're Eligible For</span></div>
      <div><strong id="fig-applied">–</strong><span>Already Applied</span></div>
    </div>
  </div>

  <div class="search-row">
    <input type="text" id="search-input" placeholder="Search by company or role...">
  </div>

  <div id="drives-container" class="card-grid"></div>
</div>

<script src="js/api.js"></script>
<script>
  const user = requireRole('student');
  document.getElementById('welcome-name').textContent = `Welcome, ${user.name}`;
  document.getElementById('welcome-sub').textContent = `CGPA: ${user.cgpa}`;

  let allDrives = [];
  let appliedDriveIds = new Set();
  let savedDriveIds = new Set();

  function renderDrives(drives) {
    const container = document.getElementById('drives-container');
    if (drives.length === 0) {
      container.innerHTML = '<div class="empty-state">No drives match your search.</div>';
      return;
    }
    container.innerHTML = drives.map(d => {
      const eligible = Number(user.cgpa) >= Number(d.min_cgpa);
      const applied = appliedDriveIds.has(d.id);
      const saved = savedDriveIds.has(d.id);
      let button;
      if (applied) {
        button = `<button class="btn btn-outline" disabled>Applied ✓</button>`;
      } else if (eligible) {
        button = `<button class="btn" onclick="apply(${d.id}, ${d.min_cgpa}, this)">Apply</button>`;
      } else {
        button = `<button class="btn" disabled title="Requires ${d.min_cgpa} CGPA, you have ${user.cgpa}">Not Eligible (needs ${d.min_cgpa} CGPA)</button>`;
      }
      return `
        <div class="drive-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div class="company">${d.company_name}</div>
            <span onclick="toggleSave(${d.id}, this)" data-saved="${saved}" style="cursor:pointer;font-size:20px;color:${saved ? 'var(--gold)' : '#C9C4B4'}" title="${saved ? 'Remove from saved' : 'Save for later'}">${saved ? '★' : '☆'}</span>
          </div>
          <div class="role">${d.role}</div>
          <div class="meta">
            <span>Package: ${d.package_offered || 'Not disclosed'}</span>
            <span>Min CGPA: ${d.min_cgpa}</span>
          </div>
          <div class="meta"><span>Drive date: ${d.drive_date ? new Date(d.drive_date).toLocaleDateString() : 'TBA'}</span></div>
          ${button}
        </div>`;
    }).join('');
  }

  async function toggleSave(driveId, el) {
    const isSaved = el.getAttribute('data-saved') === 'true';
    try {
      if (isSaved) {
        await apiRequest(`/saved/${driveId}`, 'DELETE');
        savedDriveIds.delete(driveId);
      } else {
        await apiRequest('/saved', 'POST', { drive_id: driveId });
        savedDriveIds.add(driveId);
      }
      renderDrives(allDrives.filter(d =>
        d.company_name.toLowerCase().includes(document.getElementById('search-input').value.toLowerCase()) ||
        d.role.toLowerCase().includes(document.getElementById('search-input').value.toLowerCase())
      ));
    } catch (err) {
      alert(err.message);
    }
  }

  async function loadDrives() {
    const container = document.getElementById('drives-container');
    try {
      const [drives, myApps, mySaved] = await Promise.all([
        apiRequest('/drives'),
        apiRequest(`/applications/student/${user.id}`),
        apiRequest('/saved')
      ]);
      allDrives = drives;
      appliedDriveIds = new Set(myApps.map(a => a.drive_id));
      savedDriveIds = new Set(mySaved.map(s => s.id));

      const eligibleCount = drives.filter(d => Number(user.cgpa) >= Number(d.min_cgpa)).length;
      document.getElementById('fig-total').textContent = drives.length;
      document.getElementById('fig-eligible').textContent = eligibleCount;
      document.getElementById('fig-applied').textContent = myApps.length;

      renderDrives(allDrives);
    } catch (err) {
      container.innerHTML = `<div class="error-msg">${err.message}</div>`;
    }
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    renderDrives(allDrives.filter(d =>
      d.company_name.toLowerCase().includes(q) || d.role.toLowerCase().includes(q)
    ));
  });

  async function apply(driveId, minCgpa, btn) {
    const confirmed = confirm(`Apply to this drive? This requires a minimum CGPA of ${minCgpa}. You have ${user.cgpa}.`);
    if (!confirmed) return;

    btn.disabled = true;
    btn.textContent = 'Applying...';
    try {
      await apiRequest('/applications', 'POST', { drive_id: driveId });
      await loadDrives();
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
      btn.textContent = 'Apply';
    }
  }

  loadDrives();
</script>
</body>
</html>
