<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Drives — Placement Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="brand">
    <div class="seal">PT</div>
    <div>
      <h1>Placement Tracker</h1>
      <div class="tagline">Office of Campus Recruitment</div>
    </div>
  </div>
  <div>
    <nav style="display:inline">
      <a href="student-dashboard.html">Open Drives</a>
      <a href="my-applications.html">My Applications</a>
      <a href="companies.html">Companies</a>
      <a href="saved.html">Saved</a>
      <a href="profile.html">My Profile</a>
      <a onclick="logout()" style="cursor:pointer">Log Out</a>
    </nav>
  </div>
</header>

<div class="page">
  <h2 class="page-title">Saved Drives</h2>
  <p class="page-subtitle">Drives you've bookmarked to apply to later.</p>

  <div id="saved-container" class="card-grid"></div>
</div>

<script src="js/api.js"></script>
<script>
  const user = requireRole('student');

  async function unsave(driveId) {
    try {
      await apiRequest(`/saved/${driveId}`, 'DELETE');
      loadSaved();
    } catch (err) {
      alert(err.message);
    }
  }

  async function apply(driveId, minCgpa, btn) {
    const confirmed = confirm(`Apply to this drive? This requires a minimum CGPA of ${minCgpa}. You have ${user.cgpa}.`);
    if (!confirmed) return;
    btn.disabled = true;
    btn.textContent = 'Applying...';
    try {
      await apiRequest('/applications', 'POST', { drive_id: driveId });
      loadSaved();
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
      btn.textContent = 'Apply';
    }
  }

  async function loadSaved() {
    const container = document.getElementById('saved-container');
    try {
      const [saved, myApps] = await Promise.all([
        apiRequest('/saved'),
        apiRequest(`/applications/student/${user.id}`)
      ]);
      const appliedDriveIds = new Set(myApps.map(a => a.drive_id));

      if (saved.length === 0) {
        container.innerHTML = '<div class="empty-state">You haven\'t saved any drives yet. Star a drive on the Open Drives page to bookmark it here.</div>';
        return;
      }

      container.innerHTML = saved.map(d => {
        const eligible = Number(user.cgpa) >= Number(d.min_cgpa);
        const applied = appliedDriveIds.has(d.id);
        let button;
        if (applied) {
          button = `<button class="btn btn-outline" disabled>Applied ✓</button>`;
        } else if (eligible) {
          button = `<button class="btn" onclick="apply(${d.id}, ${d.min_cgpa}, this)">Apply</button>`;
        } else {
          button = `<button class="btn" disabled title="Requires ${d.min_cgpa} CGPA, you have ${user.cgpa}">Not Eligible (needs ${d.min_cgpa} CGPA)</button>`;
        }
        return `
          <div class="drive-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div class="company">${d.company_name}</div>
              <span onclick="unsave(${d.id})" style="cursor:pointer;font-size:20px;color:var(--gold)" title="Remove from saved">★</span>
            </div>
            <div class="role">${d.role}</div>
            <div class="meta">
              <span>Package: ${d.package_offered || 'Not disclosed'}</span>
              <span>Min CGPA: ${d.min_cgpa}</span>
            </div>
            <div class="meta"><span>Drive date: ${d.drive_date ? new Date(d.drive_date).toLocaleDateString() : 'TBA'}</span></div>
            ${button}
          </div>`;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="error-msg">${err.message}</div>`;
    }
  }

  loadSaved();
</script>
</body>
</html>
